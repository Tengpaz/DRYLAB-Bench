- id: claude-fable-5
  provider: openai_compatible
  model_name: claude-fable-5
  base_url: $DRYLAB_API_BASE_URL
  api_key: $DRYLAB_API_KEY
  max_tokens: 16384
  request_timeout: 1800
  skip_on_safety_refusal: true
  max_retries: 5
  retry_base_delay: 5
  # verified 2026-09-10 via the API proxy: `reasoning_effort` → 400 ("***.***.enabled"
  # not supported; use adaptive + output_config.effort) and `temperature` is
  # deprecated → send neither (same as claude-opus-5).
  no_temperature: true
  max_concurrency: 3
- id: gpt-6-astra
  provider: openai_compatible
  model_name: gpt-6-astra
  base_url: $DRYLAB_API_BASE_URL
  api_key: $DRYLAB_API_KEY
  max_tokens: 16384
  request_timeout: 1800
  skip_on_safety_refusal: true
  max_retries: 5
  retry_base_delay: 5
  # verified 2026-09-10 via the API proxy: `temperature` accepts ONLY the default (1)
  # → no_temperature; `max_tokens` rejected → use_max_completion_tokens.
  no_temperature: true
  use_max_completion_tokens: true
  reasoning_effort: low
  max_concurrency: 3
