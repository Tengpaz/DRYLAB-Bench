conditions:
  budget:
    max_tool_calls: 4
    max_agent_rounds: 4
    max_active_candidates: 10
    max_new_candidates_per_round: 5
    final_k: 3
  state_retries: 1
  tools:
    evidence_dir: ./data/bt_evidence
    sequence_plm:
      # RUNTIME-ONLY (2026-09): no precomputed table (cache_file: null) — the
      # ESM-1v checkpoint(s) load once per process and score every candidate
      # live; n_seeds: 5 loads the full 5-seed ensemble (~12 GB RAM).
      cache_file: null
      model_root: ./data/insilico/esm1v_models
      device: auto
      n_seeds: 5
      residue_offsets: {immune_escape: -330, antibiotic_resistance: -2}
    evolution_msa:
      backend: mmseqs2_swissprot
      mmseqs_bin: ./.tools/mmseqs/bin/mmseqs
      db: ./data/bt_evidence/sprotDB
    structure_compatibility:
      backend: proteinmpnn_pdb
    functional_annotation:
      source: uniprot_gff
    toxin:
      model_path: ./data/insilico/toxinpred3_trees.npz
      window: 20
      threshold: 0.38
    phenotype:
      foldx:
        binary: ./.tools/foldx/foldx_x86
        arch_prefix: arch -x86_64
        pdb:
          cross_species: ./data/bt_evidence/1JSN.pdb
          antibiotic_resistance: ./data/bt_evidence/1BTL_clean.pdb.gz
          immune_escape: ./data/bt_evidence/6M0J.pdb.gz
          flu_h5_stability_dual: ./data/bt_evidence/2FK0_A.pdb.gz
        chain:
          cross_species: A
          antibiotic_resistance: A
          immune_escape: E
          flu_h5_stability_dual: A
        # persistent cache dir (RepairPDB models + energies_*.txt are reused
        # across runs; /tmp gets cleaned and forced a full re-repair)
        tmp_dir: ./data/bt_evidence/foldx_ondemand
        cache_dir: ./data/bt_evidence
  derived_snapshot: true
  warmup_evidence: true
approach:
  num_repeats: 3
  temperatures:
  - 0.0
  - 0.0
  - 0.0
  temperature_greedy: 0.0
  use_greedy: false
  prompt_variants: 3
  min_parse_fraction: 0.67
  random_baseline_samples: 1000
  repeat_analysis:
    min_repeats: 3
    consistency_threshold: 0.35
    dispersion_ratio_threshold: 1.5
insilico:
  enabled: true
  cache_dir: ./results/insilico_cache
  esm_root: ./data/insilico/esm_dge
  eve_tp53_file: ./data/insilico/EVE_TP53_predictions.csv
  held_out_samples: 1000
  calibration_samples: 500
  random_seed: 42
  reliability_threshold_rho: 0.4
  refusal_score_override: null
  components:
    esm2:
      enabled: true
      model: facebook/esm2_t33_650M_UR50D
    eve:
      enabled: true
    rules:
      enabled: true
statistics:
  alpha: 0.05
  bootstrap_samples: 10000
  multiple_testing_correction: bonferroni
visualization:
  style: seaborn-v0_8-whitegrid
  dpi: 150
  figsize_default:
