experiment:
  name: 15-scenario-active
  random_seed: 42
  output_dir: ./results
concurrency:
  max_workers: 6
mvp:
  enabled: true
  models:
  - claude-opus-5
  - claude-opus-4-8
  - gpt-5.6-luna
  - gpt-5.6-sol
  - gpt-5.6-terra
  - gemini-3.6-flash
  - qwen3.8-max
  - deepseek-v4-flash
  - grok-4.5
  - deepseek-v4-pro
  - kimi-k3
  - glm-5.3
  - gemini-3.8-flash
  - claude-fable-5
  - gpt-6-astra
  tasks:
  - brca1_tsg_lof
  - flu_h1_antibody_escape
  - hiv_bg505_antibody_escape
  - nipah_antibody_escape
  - lassa_antibody_escape
