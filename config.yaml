    claude-sonnet-5: '#E08A5C'
    claude-opus-4-8: '#D97757'
    gpt-5.6-luna: '#10A37F'
    gpt-5.6-sol: '#2E8B57'
    gpt-5.6-terra: '#5FA86E'
    kimi-k3: '#8B5CF6'
    deepseek-v4-flash-0731: '#4FA8E8'
    gemini-3.6-flash: '#4285F4'
    grok-4.5: '#000000'
    muse-spark-1.2: '#D08770'
    qwen3.8-max: '#E76F51'
  save_formats:
