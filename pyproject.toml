[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drylab_bench"
version = "1.0.0"
description = "LLM Protein Mutation Design Risk Evaluation Framework"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "h5py>=3.8.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "google-generativeai>=0.4.0",
    "biopython>=1.81",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipython",
    "pytest",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["drylab_bench*"]
